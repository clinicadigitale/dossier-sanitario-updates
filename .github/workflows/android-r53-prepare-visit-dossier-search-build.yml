name: Android R53 Prepare Visit Dossier Search Verified Build

on:
  push:
    branches:
      - android-r53-prepare-visit-dossier-search-0911

permissions:
  contents: read

jobs:
  build-test-sign:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild exact R52 baseline
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess
          y=Path('.github/workflows/android-r47-sync-crash-graph-layout-build.yml').read_text(encoding='utf-8')
          cmds=re.findall(r'^\s*python (android-r3/[^\s]+\.py)\s*$', y, flags=re.M)
          if not cmds or not cmds[-1].endswith('r47_compile_compat_patch.py'):
              raise SystemExit('R47 patch chain not found')
          for p in cmds:
              subprocess.check_call(['python', p])
          PY
          python android-r3/r50_r47_height_sync_finalize_fix.py
          python android-r3/r50_test_compat_patch.py
          python android-r3/r51_graph_height_ticks_sync_reminder_patch.py
          python android-r3/r51_test_compat_patch.py
          python android-r3/r52_all_graphs_portrait_landscape_height_fix.py
          python android-r3/r52_test_compat_patch.py

      - name: Freeze hashes of working R52 sectors
        run: |
          sha256sum \
            android-r3/app/src/main/java/it/dossiersanitario/clinicadigitale/beta/R12CloudManager.java \
            android-r3/app/src/main/java/it/dossiersanitario/clinicadigitale/beta/R12Crypto.java \
            android-r3/app/src/main/java/it/dossiersanitario/clinicadigitale/beta/R30BoundedWindows.java \
            android-r3/app/src/main/java/it/dossiersanitario/clinicadigitale/beta/R27ExactWindows.java \
            android-r3/app/src/main/java/it/dossiersanitario/clinicadigitale/beta/R26ChartView.java \
            android-r3/app/src/main/java/it/dossiersanitario/clinicadigitale/beta/R47GraphGeometry.java \
            android-r3/app/src/main/java/it/dossiersanitario/clinicadigitale/beta/R52GraphLayout.java \
            > /tmp/r53-frozen-before.sha
          cat /tmp/r53-frozen-before.sha

      - name: Apply only R53 standalone special tools
        run: |
          python android-r3/r53_prepare_visit_search_patch.py
          python android-r3/r53_test_compat_patch.py

      - name: Prove frozen sectors are byte-identical to R52
        run: |
          sha256sum \
            android-r3/app/src/main/java/it/dossiersanitario/clinicadigitale/beta/R12CloudManager.java \
            android-r3/app/src/main/java/it/dossiersanitario/clinicadigitale/beta/R12Crypto.java \
            android-r3/app/src/main/java/it/dossiersanitario/clinicadigitale/beta/R30BoundedWindows.java \
            android-r3/app/src/main/java/it/dossiersanitario/clinicadigitale/beta/R27ExactWindows.java \
            android-r3/app/src/main/java/it/dossiersanitario/clinicadigitale/beta/R26ChartView.java \
            android-r3/app/src/main/java/it/dossiersanitario/clinicadigitale/beta/R47GraphGeometry.java \
            android-r3/app/src/main/java/it/dossiersanitario/clinicadigitale/beta/R52GraphLayout.java \
            > /tmp/r53-frozen-after.sha
          diff -u /tmp/r53-frozen-before.sha /tmp/r53-frozen-after.sha
          echo 'R52_FROZEN_SECTORS_BYTE_IDENTICAL=PASS'

      - name: Audit R53 scope and existing invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          b=Path('android-r3/app/src/main/java/it/dossiersanitario/clinicadigitale/beta')
          main=(b/'R6MainActivity.java').read_text(encoding='utf-8')
          logic=(b/'R53VisitLogic.java').read_text(encoding='utf-8')
          activity=(b/'R53SpecialToolsActivity.java').read_text(encoding='utf-8')
          cloud=(b/'R12CloudManager.java').read_text(encoding='utf-8')
          chart=(b/'R26ChartView.java').read_text(encoding='utf-8')
          geom=(b/'R47GraphGeometry.java').read_text(encoding='utf-8')
          layout=(b/'R52GraphLayout.java').read_text(encoding='utf-8')
          bounded=(b/'R30BoundedWindows.java').read_text(encoding='utf-8')
          manifest=Path('android-r3/app/src/main/AndroidManifest.xml').read_text(encoding='utf-8')
          gradle=Path('android-r3/app/build.gradle').read_text(encoding='utf-8')

          old_pages=['Panoramica','Dati profilo','Dati di emergenza','Esenzioni','Documenti','Cronologia','Diagnosi','Terapie','Medici e specialisti','Confronta','Grafici','Agenda','Monitoraggio','Preferenze','Backup','Aiuto','Logout']
          for p in old_pages: assert '"'+p+'"' in main, p
          assert '"Prepara visita"' in main and '"Cerca nel Dossier"' in main
          assert 'R53SpecialToolsActivity.class' in main and '.R53SpecialToolsActivity' in manifest
          assert 'R53VisitLogic.prepareDocuments' in activity
          assert 'R53VisitLogic.search' in activity
          assert 'Aggiungi dal Dossier' in activity
          assert 'Stampa / Salva PDF' in activity and 'Esporta documenti originali' in activity
          assert 'Farmaci da richiedere' in activity and 'massimo 10 giorni' in activity
          assert 'Nessuna intelligenza artificiale' in activity
          assert 'therapy-reorder' in logic and 'medicationReorderItems' in logic
          assert 'gastrosc' in logic and 'instrumental' in logic
          assert 'reconstructedText' in logic and 'medicalPersonnel' in logic
          for forbidden in ['openai','gemini','anthropic','https://','http://']:
              assert forbidden not in logic.lower(), forbidden
          for forbidden in ['https://','http://']:
              assert forbidden not in activity.lower(), forbidden

          graph_instances=(main.count('new R26ChartView(')+main.count('new R33PressureChartView(')+main.count('new R33WeightJourneyChartView('))
          height_uses=main.count('dp(R52GraphLayout.containerHeightDp(r36Landscape()))')
          assert graph_instances >= 4 and height_uses == graph_instances, (graph_instances,height_uses)
          assert 'PORTRAIT_HEIGHT_DP = 430' in layout and 'LANDSCAPE_HEIGHT_DP = 430' in layout
          assert 'setMinimumHeight(dp(430))' in chart
          assert 'R47GraphGeometry.yearStart(tMin)' in chart and 'R47GraphGeometry.yearEndExclusive(tMax)' in chart
          assert 'int desired = Math.min(6, span + 1);' in geom and 'Math.max(5, desired)' in geom
          assert 'r50CopyVerified(partial, target)' in cloud and 'r50CopyVerified(old, target)' in cloud
          assert 'I dati sanitari presenti su questo dispositivo non sono aggiornati. Vuoi sincronizzarli adesso?' in main
          assert 'syncInteractiveR31(this, prefs)' in main
          assert 'private static final String POINTER = "@file:"' in bounded
          assert 'versionCode 53' in gradle and '1.0.0-android-r53-prepare-visit-dossier-search-test' in gradle
          print('OLD_PAGE_AUDIT=17/17 PASS')
          print('NEW_SPECIAL_TOOLS=2/2 PASS')
          print('R52_GRAPH_HEIGHT_FROZEN=PASS')
          print('R50_SYNC_ENGINE_FROZEN=PASS')
          print('R51_SYNC_REMINDER_FROZEN=PASS')
          print('R30_BOUNDED_IMPORT_FROZEN=PASS')
          print('R53_NO_AI_NO_NETWORK=PASS')
          PY

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore official Dossier icon
        run: |
          mkdir -p android-r3/app/src/main/res/drawable-nodpi
          base64 -d android-r3/.ci/dossier-icon-r4.b64 > android-r3/app/src/main/res/drawable-nodpi/dossier_sanitario_raw.webp
          test -s android-r3/app/src/main/res/drawable-nodpi/dossier_sanitario_raw.webp

      - name: Run all JVM regressions including R53
        run: gradle -p android-r3 --no-daemon :app:testReleaseUnitTest

      - name: Verify JVM reports and write R53 release report
        run: |
          python - <<'PY'
          import glob, xml.etree.ElementTree as ET, pathlib
          fs=glob.glob('android-r3/app/build/test-results/testReleaseUnitTest/TEST-*.xml')
          if not fs: raise SystemExit('missing JVM reports')
          t=f=e=0
          for x in fs:
              r=ET.parse(x).getroot(); t+=int(r.attrib.get('tests',0)); f+=int(r.attrib.get('failures',0)); e+=int(r.attrib.get('errors',0))
          if t < 229 or f or e: raise SystemExit(f'R53 tests={t} failures={f} errors={e}')
          report=(f'R53_TESTS=PASS\nJVM_TESTS={t}\nJVM_FAILURES={f}\nJVM_ERRORS={e}\n'
                  'OLD_PAGE_AUDIT=17/17 PASS\nNEW_SPECIAL_TOOLS=2/2 PASS\n'
                  'R52_FROZEN_SECTORS_BYTE_IDENTICAL=PASS\nR30_BOUNDED_IMPORT_FROZEN=PASS\n'
                  'R50_SYNC_ENGINE_FROZEN=PASS\nR51_STARTUP_REMINDER_FROZEN=PASS\nR52_GRAPH_HEIGHT_FROZEN=PASS\n'
                  'R53_NO_AI_NO_NETWORK=PASS\n')
          pathlib.Path('android-r3/r53-build-test-report.txt').write_text(report); print(report)
          PY

      - name: Add pinned Android cloud transport
        run: |
          mkdir -p android-r3/app/src/main/jniLibs/arm64-v8a
          curl --fail --location --retry 3 --retry-delay 2 https://beta.rclone.org/v1.75.0/testbuilds/rclone-android-21-armv8a.gz --output /tmp/rclone-android.gz
          gzip -dc /tmp/rclone-android.gz > android-r3/app/src/main/jniLibs/arm64-v8a/librclone.so
          chmod 755 android-r3/app/src/main/jniLibs/arm64-v8a/librclone.so

      - name: Restore fixed R13 beta signing identity
        run: |
          base64 -d android-r3/.ci/beta-keystore.b64 > android-r3/beta-test.jks
          chmod 600 android-r3/beta-test.jks

      - name: Build signed R53 APK
        run: gradle -p android-r3 --no-daemon :app:assembleRelease

      - name: Verify R53 APK identity signature permissions and transport
        run: |
          APK=android-r3/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee android-r3/apk-verification.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 12 | tee -a android-r3/apk-verification.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK" | tee -a android-r3/apk-verification.txt
          unzip -l "$APK" | grep 'lib/arm64-v8a/librclone.so' | tee -a android-r3/apk-verification.txt
          tr -d ':' < android-r3/apk-verification.txt | tr 'A-Z' 'a-z' | grep -q '9abd08f6382a49975b71ffff1a76fbb3292b508f2a3404fa0e4b2b1f3f2d1a0e'
          grep -q "package: name='it.dossiersanitario.clinicadigitale.beta' versionCode='53' versionName='1.0.0-android-r53-prepare-visit-dossier-search-test'" android-r3/apk-verification.txt
          ! "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK" | grep -Eq 'READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE|MANAGE_EXTERNAL_STORAGE|READ_MEDIA_IMAGES|READ_MEDIA_VIDEO|READ_MEDIA_AUDIO|READ_CONTACTS|ACCESS_FINE_LOCATION|RECORD_AUDIO|CALL_PHONE'
          echo "SIZE=$(stat -c%s "$APK")" | tee -a android-r3/apk-verification.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ClinicaDigitale_Android_R53_PREPARE_VISIT_DOSSIER_SEARCH_VERIFIED_APK
          path: |
            android-r3/app/build/outputs/apk/release/app-release.apk
            android-r3/apk-verification.txt
            android-r3/r53-build-test-report.txt
          if-no-files-found: error
          retention-days: 1
