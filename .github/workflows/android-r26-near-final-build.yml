name: Android R26 Near Final Verified Build

on:
  push:
    branches:
      - android-r26-near-final-0904

permissions:
  contents: read

jobs:
  build-test-sign:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply source patches through R26
        run: |
          python android-r3/r8_patch.py
          python android-r3/r9_patch.py
          python android-r3/r10_patch.py
          python android-r3/r12_patch.py
          python android-r3/r12_final_patch.py
          python android-r3/r13_patch.py
          python android-r3/r14_patch.py
          python android-r3/r15_patch.py
          python android-r3/r15_compile_fix.py
          python android-r3/r16_patch.py
          python android-r3/r17_patch.py
          python android-r3/r18_patch.py
          python android-r3/r18_runtime_fix.py
          python android-r3/r19_patch.py
          python android-r3/r20_checkpoint_crypto_patch.py
          python android-r3/r21_fast_integrity_resume_patch.py
          python android-r3/r22_streaming_integrity_patch.py
          python android-r3/r23_login_iv_fix_patch_v2.py
          python android-r3/r24_admin_profile_resume_patch.py
          python android-r3/r25_stream_fix_eye_patch.py
          python android-r3/r26_full_snapshot_bridge_patch.py
          python android-r3/r26_near_final_ui_patch.py

      - name: Verify R26 source invariants
        run: |
          grep -q 'Android R26 QUASI DEFINITIVA' android-r3/app/src/main/java/it/dossiersanitario/clinicadigitale/beta/R6MainActivity.java
          grep -q 'R26SnapshotBridge.Capture' android-r3/app/src/main/java/it/dossiersanitario/clinicadigitale/beta/R12CloudManager.java
          grep -q 'capture.commit(prefs)' android-r3/app/src/main/java/it/dossiersanitario/clinicadigitale/beta/R12CloudManager.java
          grep -q 'case "Diagnosi": renderDiagnosi()' android-r3/app/src/main/java/it/dossiersanitario/clinicadigitale/beta/R6MainActivity.java
          grep -q 'case "Terapie": renderTerapie()' android-r3/app/src/main/java/it/dossiersanitario/clinicadigitale/beta/R6MainActivity.java
          grep -q 'case "Confronta": renderConfronta()' android-r3/app/src/main/java/it/dossiersanitario/clinicadigitale/beta/R6MainActivity.java
          grep -q 'case "Grafici": renderGrafici()' android-r3/app/src/main/java/it/dossiersanitario/clinicadigitale/beta/R6MainActivity.java
          grep -q 'Tessera Sanitaria' android-r3/app/src/main/java/it/dossiersanitario/clinicadigitale/beta/R6MainActivity.java
          grep -q 'R26SnapshotBridge.themeColor' android-r3/app/src/main/java/it/dossiersanitario/clinicadigitale/beta/R6MainActivity.java
          grep -q 'R26SnapshotBridge.userColorRows' android-r3/app/src/main/java/it/dossiersanitario/clinicadigitale/beta/R6MainActivity.java
          grep -q 'android:configChanges="orientation|screenSize|keyboardHidden"' android-r3/app/src/main/AndroidManifest.xml
          grep -q 'passwordEye' android-r3/app/src/main/java/it/dossiersanitario/clinicadigitale/beta/R6MainActivity.java
          grep -q 'Ricorda le credenziali su questo dispositivo' android-r3/app/src/main/java/it/dossiersanitario/clinicadigitale/beta/R6MainActivity.java
          grep -q 'cipher.init(Cipher.ENCRYPT_MODE, key);' android-r3/app/src/main/java/it/dossiersanitario/clinicadigitale/beta/R12Crypto.java
          grep -q 'R22StreamingDsl5.decryptVerified' android-r3/app/src/main/java/it/dossiersanitario/clinicadigitale/beta/R12CloudManager.java
          grep -q "versionCode 26" android-r3/app/build.gradle
          grep -q "versionName '1.0.0-android-r26-near-final'" android-r3/app/build.gradle

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore official Dossier icon
        run: |
          mkdir -p android-r3/app/src/main/res/drawable-nodpi
          base64 -d android-r3/.ci/dossier-icon-r4.b64 > android-r3/app/src/main/res/drawable-nodpi/dossier_sanitario_raw.webp
          test -s android-r3/app/src/main/res/drawable-nodpi/dossier_sanitario_raw.webp

      - name: Run JVM regressions through R26
        run: gradle -p android-r3 --no-daemon :app:testReleaseUnitTest --tests it.dossiersanitario.clinicadigitale.beta.R17ProgressRuntimeTest --tests it.dossiersanitario.clinicadigitale.beta.R18ResumeRuntimeTest --tests it.dossiersanitario.clinicadigitale.beta.R19TransactionRuntimeTest --tests it.dossiersanitario.clinicadigitale.beta.R20CheckpointRuntimeTest --tests it.dossiersanitario.clinicadigitale.beta.R21FastIntegrityResumeTest --tests it.dossiersanitario.clinicadigitale.beta.R22StreamingIntegrityTest --tests it.dossiersanitario.clinicadigitale.beta.R23LoginIvFixTest --tests it.dossiersanitario.clinicadigitale.beta.R24AdminProfileResumeTest --tests it.dossiersanitario.clinicadigitale.beta.R25StreamClosedEyeTest --tests it.dossiersanitario.clinicadigitale.beta.R26NearFinalTest

      - name: Verify JVM test reports
        run: |
          python - <<'PY'
          import glob, xml.etree.ElementTree as ET
          files = glob.glob('android-r3/app/build/test-results/testReleaseUnitTest/TEST-*.xml')
          if not files:
              raise SystemExit('JVM test reports missing')
          tests = failures = errors = 0
          for path in files:
              root = ET.parse(path).getroot()
              tests += int(root.attrib.get('tests', 0))
              failures += int(root.attrib.get('failures', 0))
              errors += int(root.attrib.get('errors', 0))
          if tests < 35 or failures or errors:
              raise SystemExit(f'R26 regression gate failed tests={tests} failures={failures} errors={errors}')
          report = f'R26_TESTS=PASS\nJVM_TESTS={tests}\nJVM_FAILURES={failures}\nJVM_ERRORS={errors}\n'
          open('android-r3/r26-build-test-report.txt','w',encoding='utf-8').write(report)
          print(report)
          PY

      - name: Add pinned Android cloud transport
        run: |
          mkdir -p android-r3/app/src/main/jniLibs/arm64-v8a
          curl --fail --location --retry 3 --retry-delay 2 https://beta.rclone.org/v1.75.0/testbuilds/rclone-android-21-armv8a.gz --output /tmp/rclone-android.gz
          gzip -dc /tmp/rclone-android.gz > android-r3/app/src/main/jniLibs/arm64-v8a/librclone.so
          chmod 755 android-r3/app/src/main/jniLibs/arm64-v8a/librclone.so
          test -s android-r3/app/src/main/jniLibs/arm64-v8a/librclone.so

      - name: Restore fixed beta signing key
        run: |
          base64 -d android-r3/.ci/beta-keystore.b64 > android-r3/beta-test.jks
          chmod 600 android-r3/beta-test.jks

      - name: Build signed R26 release APK
        run: gradle -p android-r3 --no-daemon :app:assembleRelease

      - name: Verify R26 APK identity signature permissions and transport
        run: |
          APK=android-r3/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee android-r3/apk-verification.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 12 | tee -a android-r3/apk-verification.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK" | tee -a android-r3/apk-verification.txt
          unzip -l "$APK" | grep 'lib/arm64-v8a/librclone.so' | tee -a android-r3/apk-verification.txt
          grep -qi '9abd08f6382a49975b71ffff1a76fbb3292b508f2a3404fa0e4b2b1f3f2d1a0e' android-r3/apk-verification.txt
          grep -q "package: name='it.dossiersanitario.clinicadigitale.beta' versionCode='26' versionName='1.0.0-android-r26-near-final'" android-r3/apk-verification.txt
          ! "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK" | grep -Eq 'READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE|MANAGE_EXTERNAL_STORAGE|READ_MEDIA_IMAGES|READ_MEDIA_VIDEO|READ_MEDIA_AUDIO|READ_CONTACTS|ACCESS_FINE_LOCATION|RECORD_AUDIO'
          echo "SIZE=$(stat -c%s "$APK")" | tee -a android-r3/apk-verification.txt

      - name: Upload verified R26 APK
        uses: actions/upload-artifact@v4
        with:
          name: ClinicaDigitale_Android_R26_NEAR_FINAL_VERIFIED_APK
          path: |
            android-r3/app/build/outputs/apk/release/app-release.apk
            android-r3/apk-verification.txt
            android-r3/r26-build-test-report.txt
          if-no-files-found: error
          retention-days: 1
