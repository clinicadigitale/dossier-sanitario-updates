name: Android R14 Family Password Build

on:
  push:
    branches:
      - android-r14-family-password-0903

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply R8 source patch
        run: python android-r3/r8_patch.py

      - name: Apply R9 source patch
        run: python android-r3/r9_patch.py

      - name: Apply R10 and R11 source patches
        run: python android-r3/r10_patch.py

      - name: Apply R12 family cloud patch
        run: python android-r3/r12_patch.py

      - name: Apply R12 final invariants
        run: python android-r3/r12_final_patch.py

      - name: Apply R13 fixes
        run: python android-r3/r13_patch.py

      - name: Verify R13 source invariants before R14
        run: |
          grep -q 'Android R13 TEST' android-r3/app/src/main/java/it/dossiersanitario/clinicadigitale/beta/R6MainActivity.java
          grep -q 'PDF / file' android-r3/app/src/main/java/it/dossiersanitario/clinicadigitale/beta/R6MainActivity.java
          grep -q 'Scatta foto' android-r3/app/src/main/java/it/dossiersanitario/clinicadigitale/beta/R6MainActivity.java
          grep -q 'Scansiona documento' android-r3/app/src/main/java/it/dossiersanitario/clinicadigitale/beta/R6MainActivity.java
          grep -q 'confirmDeletePrivateDocument' android-r3/app/src/main/java/it/dossiersanitario/clinicadigitale/beta/R6MainActivity.java
          grep -q 'documentActionButton' android-r3/app/src/main/java/it/dossiersanitario/clinicadigitale/beta/R6MainActivity.java
          grep -q 'Collega questo dispositivo al mio account esistente' android-r3/app/src/main/java/it/dossiersanitario/clinicadigitale/beta/R12CloudManager.java
          grep -q 'verifyAccountPassword' android-r3/app/src/main/java/it/dossiersanitario/clinicadigitale/beta/R12Crypto.java
          grep -q 'portableMfaUnprotect' android-r3/app/src/main/java/it/dossiersanitario/clinicadigitale/beta/R12Crypto.java
          grep -q 'queueLocalPhotoDelete' android-r3/app/src/main/java/it/dossiersanitario/clinicadigitale/beta/R12CloudManager.java
          ! grep -q 'durationMinutes", 60' android-r3/app/src/main/java/it/dossiersanitario/clinicadigitale/beta/R12CloudManager.java

      - name: Apply R14 family password relay patch
        run: python android-r3/r14_patch.py

      - name: Verify R14 surgical invariants
        run: |
          grep -q 'Android R14 TEST' android-r3/app/src/main/java/it/dossiersanitario/clinicadigitale/beta/R6MainActivity.java
          grep -q 'Chiave Dossier · 15 caratteri' android-r3/app/src/main/java/it/dossiersanitario/clinicadigitale/beta/R12CloudManager.java
          grep -q 'Collega il mio account esistente' android-r3/app/src/main/java/it/dossiersanitario/clinicadigitale/beta/R12CloudManager.java
          grep -q 'FAMILY_RELAY_URL' android-r3/app/src/main/java/it/dossiersanitario/clinicadigitale/beta/R12CloudManager.java
          grep -q 'PBKDF2WithHmacSHA256' android-r3/app/src/main/java/it/dossiersanitario/clinicadigitale/beta/R12CloudManager.java
          grep -q 'AES/GCM/NoPadding' android-r3/app/src/main/java/it/dossiersanitario/clinicadigitale/beta/R12CloudManager.java
          ! grep -q 'Codice accesso provvisorio' android-r3/app/src/main/java/it/dossiersanitario/clinicadigitale/beta/R12CloudManager.java
          grep -q "versionCode 14" android-r3/app/build.gradle
          grep -q "versionName '1.0.0-android-r14-test'" android-r3/app/build.gradle

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Add pinned Android cloud transport
        run: |
          mkdir -p android-r3/app/src/main/jniLibs/arm64-v8a
          curl --fail --location --retry 3 --retry-delay 2 \
            https://beta.rclone.org/v1.75.0/testbuilds/rclone-android-21-armv8a.gz \
            --output /tmp/rclone-android.gz
          gzip -dc /tmp/rclone-android.gz > android-r3/app/src/main/jniLibs/arm64-v8a/librclone.so
          chmod 755 android-r3/app/src/main/jniLibs/arm64-v8a/librclone.so
          test -s android-r3/app/src/main/jniLibs/arm64-v8a/librclone.so

      - name: Restore fixed beta signing key
        run: |
          base64 -d android-r3/.ci/beta-keystore.b64 > android-r3/beta-test.jks
          chmod 600 android-r3/beta-test.jks

      - name: Restore official Dossier icon
        run: |
          mkdir -p android-r3/app/src/main/res/drawable-nodpi
          base64 -d android-r3/.ci/dossier-icon-r4.b64 > android-r3/app/src/main/res/drawable-nodpi/dossier_sanitario_raw.webp

      - name: Build signed release APK
        env:
          CLINICA_KEYSTORE: ${{ github.workspace }}/android-r3/beta-test.jks
          CLINICA_STORE_PASSWORD: ClinicaBeta2026!
          CLINICA_KEY_ALIAS: clinica_beta
          CLINICA_KEY_PASSWORD: ClinicaBeta2026!
        run: gradle -p android-r3 --no-daemon :app:assembleRelease

      - name: Verify APK identity signature permissions and transport
        run: |
          APK=android-r3/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee android-r3/apk-verification.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 12 | tee -a android-r3/apk-verification.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK" | tee -a android-r3/apk-verification.txt
          unzip -l "$APK" | grep 'lib/arm64-v8a/librclone.so' | tee -a android-r3/apk-verification.txt
          grep -qi '9abd08f6382a49975b71ffff1a76fbb3292b508f2a3404fa0e4b2b1f3f2d1a0e' android-r3/apk-verification.txt
          grep -q "package: name='it.dossiersanitario.clinicadigitale.beta' versionCode='14' versionName='1.0.0-android-r14-test'" android-r3/apk-verification.txt
          ! "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK" | grep -Eq 'READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE|MANAGE_EXTERNAL_STORAGE|READ_MEDIA_IMAGES|READ_MEDIA_VIDEO|READ_MEDIA_AUDIO|READ_CONTACTS|ACCESS_FINE_LOCATION|RECORD_AUDIO'
          echo "SHA256=$(sha256sum "$APK" | awk '{print $1}')" | tee -a android-r3/apk-verification.txt
          echo "SIZE=$(stat -c%s "$APK")" | tee -a android-r3/apk-verification.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ClinicaDigitale_Android_R14_FAMILY_PASSWORD_APK
          path: |
            android-r3/app/build/outputs/apk/release/app-release.apk
            android-r3/apk-verification.txt
          if-no-files-found: error
          retention-days: 1
