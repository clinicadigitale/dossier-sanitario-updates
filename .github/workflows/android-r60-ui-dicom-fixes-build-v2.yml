name: Android R60 Graphical UI DICOM Fixes Verified Build V2

on:
  push:
    branches:
      - android-r60-ui-dicom-fixes-0916

permissions:
  contents: read

jobs:
  build-test-sign:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild exact R59 delivered baseline
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess
          y=Path('.github/workflows/android-r47-sync-crash-graph-layout-build.yml').read_text(encoding='utf-8')
          cmds=re.findall(r'^\s*python (android-r3/[^\s]+\.py)\s*$', y, flags=re.M)
          if not cmds or not cmds[-1].endswith('r47_compile_compat_patch.py'):
              raise SystemExit('R47 patch chain not found')
          for p in cmds:
              subprocess.check_call(['python', p])
          PY
          python android-r3/r50_r47_height_sync_finalize_fix.py
          python android-r3/r50_test_compat_patch.py
          python android-r3/r51_graph_height_ticks_sync_reminder_patch.py
          python android-r3/r51_test_compat_patch.py
          python android-r3/r52_all_graphs_portrait_landscape_height_fix.py
          python android-r3/r52_test_compat_patch.py
          python android-r3/r53_prepare_visit_search_patch.py
          python android-r3/r53_test_compat_patch.py
          python android-r3/r54_ui_export_fix.py
          python android-r3/r55_special_tools_layout_order_cleanup.py
          python android-r3/r56_modern_media_parity_patch.py
          python android-r3/r57_sync_crash_media_fix.py
          python android-r3/r58_modern_ui_media_patch_v2.py
          python android-r3/r59_full_modern_parity_patch.py

      - name: Freeze unrelated approved engines
        run: |
          sha256sum \
            android-r3/app/src/main/java/it/dossiersanitario/clinicadigitale/beta/R12CloudManager.java \
            android-r3/app/src/main/java/it/dossiersanitario/clinicadigitale/beta/R12Crypto.java \
            android-r3/app/src/main/java/it/dossiersanitario/clinicadigitale/beta/R30BoundedWindows.java \
            android-r3/app/src/main/java/it/dossiersanitario/clinicadigitale/beta/R57BoundedGcmDecryptor.java \
            android-r3/app/src/main/java/it/dossiersanitario/clinicadigitale/beta/R27ExactWindows.java \
            android-r3/app/src/main/java/it/dossiersanitario/clinicadigitale/beta/R26ChartView.java \
            android-r3/app/src/main/java/it/dossiersanitario/clinicadigitale/beta/R47GraphGeometry.java \
            android-r3/app/src/main/java/it/dossiersanitario/clinicadigitale/beta/R52GraphLayout.java \
            android-r3/app/src/main/java/it/dossiersanitario/clinicadigitale/beta/R53VisitLogic.java \
            android-r3/app/src/main/java/it/dossiersanitario/clinicadigitale/beta/R53SpecialToolsActivity.java \
            android-r3/app/src/main/java/it/dossiersanitario/clinicadigitale/beta/R34BiometricAuth.java \
            android-r3/app/src/main/AndroidManifest.xml \
            > /tmp/r60-frozen-before.sha

      - name: Apply R60 graphical UI and DICOM fixes
        run: python android-r3/r60_ui_dicom_fixes_patch.py

      - name: Prove unrelated approved engines are byte-identical
        run: |
          sha256sum \
            android-r3/app/src/main/java/it/dossiersanitario/clinicadigitale/beta/R12CloudManager.java \
            android-r3/app/src/main/java/it/dossiersanitario/clinicadigitale/beta/R12Crypto.java \
            android-r3/app/src/main/java/it/dossiersanitario/clinicadigitale/beta/R30BoundedWindows.java \
            android-r3/app/src/main/java/it/dossiersanitario/clinicadigitale/beta/R57BoundedGcmDecryptor.java \
            android-r3/app/src/main/java/it/dossiersanitario/clinicadigitale/beta/R27ExactWindows.java \
            android-r3/app/src/main/java/it/dossiersanitario/clinicadigitale/beta/R26ChartView.java \
            android-r3/app/src/main/java/it/dossiersanitario/clinicadigitale/beta/R47GraphGeometry.java \
            android-r3/app/src/main/java/it/dossiersanitario/clinicadigitale/beta/R52GraphLayout.java \
            android-r3/app/src/main/java/it/dossiersanitario/clinicadigitale/beta/R53VisitLogic.java \
            android-r3/app/src/main/java/it/dossiersanitario/clinicadigitale/beta/R53SpecialToolsActivity.java \
            android-r3/app/src/main/java/it/dossiersanitario/clinicadigitale/beta/R34BiometricAuth.java \
            android-r3/app/src/main/AndroidManifest.xml \
            > /tmp/r60-frozen-after.sha
          diff -u /tmp/r60-frozen-before.sha /tmp/r60-frozen-after.sha
          echo 'R60_UNRELATED_ENGINES_BYTE_IDENTICAL=PASS'

      - name: Audit exact R60 requested corrections in generated source
        run: |
          python - <<'PY'
          from pathlib import Path
          b=Path('android-r3/app/src/main/java/it/dossiersanitario/clinicadigitale/beta')
          main=(b/'R6MainActivity.java').read_text(encoding='utf-8')
          media=(b/'R56MediaActivity.java').read_text(encoding='utf-8')
          pressure=(b/'R33PressureChartView.java').read_text(encoding='utf-8')
          gradle=Path('android-r3/app/build.gradle').read_text(encoding='utf-8')
          dr=Path('android-r3/app/src/main/res/drawable')
          icons=list(dr.glob('r60_ic_*.xml'))
          assert len(icons) >= 20, len(icons)
          for p in icons:
              x=p.read_text(encoding='utf-8')
              assert '<vector' in x and 'pathData=' in x, p
          for old in ['☰  Sezioni','＋  Acquisisci','⇧  Importa file','▤  Documenti','▧  Imaging e media','🗺  Apri mappa','☁  Meteo']:
              assert old not in main, old
          exact=[
            'r60SetIcon(menu, R.drawable.r60_ic_menu',
            'r60Action("Documenti",R.drawable.r60_ic_documents',
            'r60Action("Imaging e media",R.drawable.r60_ic_image',
            'if(i>0)recent.addView(r59Divider())',
            'if(i>0)agenda.addView(r59Divider())',
            'ViewGroup.LayoutParams.MATCH_PARENT,dp(2)',
            'r34MakeContactAction(val,label,value)',
            'dp(108)',
            'r60ExemptionLabelValue("Descrizione",description)',
            'dp(128)',
            'DICOM e Imaging',
            'c.addView(text(title,16,TEXT,true))',
            'statusRow.addView(r59Pill(type',
            'grid.setColumnCount(r36Landscape()?4:2)',
            'r60GraphOpenBody',
            'r60GraphDocumentBody',
            'Segna come risolto',
            'Riapri appuntamento',
            'r60Action(title,R.drawable.r60_ic_help',
            'r59HelpOpenBody'
          ]
          for x in exact:
              assert x in main, x
          assert 'getHeight() - dp(96)' in pressure
          assert 'canvas.rotate(-45f' in pressure
          for x in [
            'Importa DICOM da telefono, USB o archivio collegato',
            'Porta lo studio sul dispositivo',
            'Dimensione studio:',
            'Spazio residuo previsto:',
            'R27ExactWindows.upsertData(prefs,"dicomStudies",study)',
            'Nessuno studio DICOM ricevuto dal catalogo sincronizzato',
            'r60_ic_image'
          ]:
              assert x in media, x
          assert 'versionCode 60' in gradle
          assert "versionName '1.0.0-android-r60-ui-dicom-fixes-test'" in gradle
          print('R60_SOURCE_AUDIT=PASS')
          PY

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Install Android SDK 35
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore official Dossier icon
        run: |
          mkdir -p android-r3/app/src/main/res/drawable-nodpi
          base64 -d android-r3/.ci/dossier-icon-r4.b64 > android-r3/app/src/main/res/drawable-nodpi/dossier_sanitario_raw.webp
          test -s android-r3/app/src/main/res/drawable-nodpi/dossier_sanitario_raw.webp

      - name: Run all JVM regressions
        run: gradle -p android-r3 --no-daemon :app:testReleaseUnitTest

      - name: Verify JVM reports
        run: |
          python - <<'PY'
          import glob, xml.etree.ElementTree as ET, pathlib
          fs=glob.glob('android-r3/app/build/test-results/testReleaseUnitTest/TEST-*.xml')
          if not fs: raise SystemExit('missing JVM reports')
          t=f=e=0
          for x in fs:
              r=ET.parse(x).getroot(); t+=int(r.attrib.get('tests',0)); f+=int(r.attrib.get('failures',0)); e+=int(r.attrib.get('errors',0))
          if f or e: raise SystemExit(f'R60 tests={t} failures={f} errors={e}')
          pathlib.Path('/tmp/r60-tests.txt').write_text(f'JVM_TESTS={t}\nJVM_FAILURES={f}\nJVM_ERRORS={e}\n')
          print(pathlib.Path('/tmp/r60-tests.txt').read_text())
          PY

      - name: Add pinned Android cloud transport
        run: |
          mkdir -p android-r3/app/src/main/jniLibs/arm64-v8a
          curl --fail --location --retry 3 --retry-delay 2 https://beta.rclone.org/v1.75.0/testbuilds/rclone-android-21-armv8a.gz --output /tmp/rclone-android.gz
          gzip -dc /tmp/rclone-android.gz > android-r3/app/src/main/jniLibs/arm64-v8a/librclone.so
          chmod 755 android-r3/app/src/main/jniLibs/arm64-v8a/librclone.so

      - name: Restore fixed R13 beta signing identity
        run: |
          base64 -d android-r3/.ci/beta-keystore.b64 > android-r3/beta-test.jks
          chmod 600 android-r3/beta-test.jks

      - name: Build signed R60 APK
        run: gradle -p android-r3 --no-daemon :app:assembleRelease

      - name: Verify compiled APK identity signature permissions resources
        run: |
          APK=android-r3/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee android-r3/apk-verification.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 12 | tee -a android-r3/apk-verification.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK" | tee -a android-r3/apk-verification.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump resources "$APK" > android-r3/apk-resources.txt
          for R in r60_ic_documents r60_ic_image r60_ic_calendar r60_ic_therapy r60_ic_diagnosis r60_ic_help r60_ic_map r60_ic_weather; do
            grep -q "$R" android-r3/apk-resources.txt || { echo "MISSING_COMPILED_RESOURCE=$R"; exit 1; }
          done
          unzip -l "$APK" | grep 'lib/arm64-v8a/librclone.so' | tee -a android-r3/apk-verification.txt
          tr -d ':' < android-r3/apk-verification.txt | tr 'A-Z' 'a-z' | grep -q '9abd08f6382a49975b71ffff1a76fbb3292b508f2a3404fa0e4b2b1f3f2d1a0e'
          grep -q "package: name='it.dossiersanitario.clinicadigitale.beta' versionCode='60' versionName='1.0.0-android-r60-ui-dicom-fixes-test'" android-r3/apk-verification.txt
          ! "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK" | grep -Eq 'READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE|MANAGE_EXTERNAL_STORAGE|READ_MEDIA_IMAGES|READ_MEDIA_VIDEO|READ_MEDIA_AUDIO|READ_CONTACTS|ACCESS_FINE_LOCATION|RECORD_AUDIO|CALL_PHONE'
          echo "COMPILED_VECTOR_ICONS=PASS" | tee -a android-r3/apk-verification.txt
          echo "SIZE=$(stat -c%s "$APK")" | tee -a android-r3/apk-verification.txt

      - name: Write final R60 verification report
        run: |
          cat /tmp/r60-tests.txt > android-r3/r60-build-test-report.txt
          cat >> android-r3/r60-build-test-report.txt <<'EOF'
          R60_TESTS=PASS
          R60_SOURCE_AUDIT=PASS
          R60_COMPILED_VECTOR_ICONS=PASS
          R60_PORTRAIT_HERO_ACTION_ROW=PASS
          R60_VISIBLE_AGENDA_RECENT_DIVIDERS=PASS
          R60_EMERGENCY_EMAIL_CLICKABLE_LAYOUT=PASS
          R60_EXEMPTION_PORTRAIT_WIDTH=PASS
          R60_DOCUMENTS_DICOM_SECTION=PASS
          R60_CHRONO_STACKED_STATUS=PASS
          R60_THERAPY_READABILITY_4COL=PASS
          R60_GRAPH_INLINE_ACCORDION=PASS
          R60_AGENDA_RESOLVED_ACTION=PASS
          R60_MONITOR_DATE_LAYOUT=PASS
          R60_IMAGING_IMPORT_STORAGE_PREFLIGHT=PASS
          R60_HELP_GRAPHICAL_ACCORDION=PASS
          R57_SYNC_FIX_PRESERVED=PASS
          R60_UNRELATED_ENGINES_BYTE_IDENTICAL=PASS
          EOF
          cat android-r3/r60-build-test-report.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ClinicaDigitale_Android_R60_GRAPHICAL_UI_DICOM_FIXES_VERIFIED_APK_V2
          path: |
            android-r3/app/build/outputs/apk/release/app-release.apk
            android-r3/apk-verification.txt
            android-r3/apk-resources.txt
            android-r3/r60-build-test-report.txt
          if-no-files-found: error
          retention-days: 1
