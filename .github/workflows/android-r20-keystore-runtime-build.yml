name: Android R20 Keystore Runtime Verified Build

on:
  push:
    branches:
      - android-r19-transactional-resume-0904

permissions:
  contents: read

jobs:
  build-test-sign:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply source patches through R20
        run: |
          python android-r3/r8_patch.py
          python android-r3/r9_patch.py
          python android-r3/r10_patch.py
          python android-r3/r12_patch.py
          python android-r3/r12_final_patch.py
          python android-r3/r13_patch.py
          python android-r3/r14_patch.py
          python android-r3/r15_patch.py
          python android-r3/r15_compile_fix.py
          python android-r3/r16_patch.py
          python android-r3/r17_patch.py
          python android-r3/r18_patch.py
          python android-r3/r18_runtime_fix.py
          python android-r3/r19_patch.py
          python android-r3/r20_checkpoint_crypto_patch.py

      - name: Verify R20 source invariants
        run: |
          grep -q 'Android R20 TEST' android-r3/app/src/main/java/it/dossiersanitario/clinicadigitale/beta/R6MainActivity.java
          grep -q 'R20CheckpointCrypto.protect(context, state.toString())' android-r3/app/src/main/java/it/dossiersanitario/clinicadigitale/beta/R12CloudManager.java
          grep -q 'R20CheckpointCrypto.unprotect(activity, protectedState)' android-r3/app/src/main/java/it/dossiersanitario/clinicadigitale/beta/R12CloudManager.java
          grep -q 'clinica_digitale_r20_import_checkpoint' android-r3/app/src/main/java/it/dossiersanitario/clinicadigitale/beta/R20CheckpointCrypto.java
          grep -q 'new int\[\]{256, 128}' android-r3/app/src/main/java/it/dossiersanitario/clinicadigitale/beta/R20CheckpointCrypto.java
          grep -q 'Riprendi importazione del Dossier' android-r3/app/src/main/java/it/dossiersanitario/clinicadigitale/beta/R12CloudManager.java
          grep -q 'safeStartExistingImportProgress' android-r3/app/src/main/java/it/dossiersanitario/clinicadigitale/beta/R12CloudManager.java
          grep -q 'FLAG_KEEP_SCREEN_ON' android-r3/app/src/main/java/it/dossiersanitario/clinicadigitale/beta/R12CloudManager.java
          grep -q 'PARTIAL_WAKE_LOCK' android-r3/app/src/main/java/it/dossiersanitario/clinicadigitale/beta/R12CloudManager.java
          grep -q 'IMPORT_PROGRESS_START = 0' android-r3/app/src/main/java/it/dossiersanitario/clinicadigitale/beta/R12CloudManager.java
          grep -q 'INTEGRITY_PROGRESS_START = 65' android-r3/app/src/main/java/it/dossiersanitario/clinicadigitale/beta/R12CloudManager.java
          grep -q 'INTEGRITY_PROGRESS_END = 78' android-r3/app/src/main/java/it/dossiersanitario/clinicadigitale/beta/R12CloudManager.java
          grep -q "versionCode 20" android-r3/app/build.gradle
          grep -q "versionName '1.0.0-android-r20-test'" android-r3/app/build.gradle

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore official Dossier icon
        run: |
          mkdir -p android-r3/app/src/main/res/drawable-nodpi
          base64 -d android-r3/.ci/dossier-icon-r4.b64 > android-r3/app/src/main/res/drawable-nodpi/dossier_sanitario_raw.webp
          test -s android-r3/app/src/main/res/drawable-nodpi/dossier_sanitario_raw.webp

      - name: Prepare isolated Android keystore smoke app
        run: |
          printf "\ninclude ':checkpoint-smoke'\n" >> android-r3/settings.gradle
          mkdir -p android-r3/checkpoint-smoke/src/main/java/it/dossiersanitario/clinicadigitale/beta
          cp android-r3/app/src/main/java/it/dossiersanitario/clinicadigitale/beta/R20CheckpointCrypto.java android-r3/checkpoint-smoke/src/main/java/it/dossiersanitario/clinicadigitale/beta/R20CheckpointCrypto.java

      - name: Run existing JVM regression tests plus R20 structural test
        run: gradle -p android-r3 --no-daemon :app:testReleaseUnitTest --tests it.dossiersanitario.clinicadigitale.beta.R17ProgressRuntimeTest --tests it.dossiersanitario.clinicadigitale.beta.R18ResumeRuntimeTest --tests it.dossiersanitario.clinicadigitale.beta.R19TransactionalResumeRuntimeTest --tests it.dossiersanitario.clinicadigitale.beta.R20CheckpointRuntimeTest

      - name: Run real Android Keystore checkpoint smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: gradle -p android-r3 --no-daemon :checkpoint-smoke:connectedDebugAndroidTest

      - name: Verify all test reports
        run: |
          python - <<'PY'
          import glob, xml.etree.ElementTree as ET
          files = glob.glob('android-r3/app/build/test-results/testReleaseUnitTest/TEST-*.xml')
          files += glob.glob('android-r3/checkpoint-smoke/build/outputs/androidTest-results/connected/**/TEST-*.xml', recursive=True)
          if not files:
              raise SystemExit('Test reports missing')
          tests = failures = errors = 0
          for path in files:
              root = ET.parse(path).getroot()
              tests += int(root.attrib.get('tests', 0))
              failures += int(root.attrib.get('failures', 0))
              errors += int(root.attrib.get('errors', 0))
          print(f'TESTS={tests} FAILURES={failures} ERRORS={errors}')
          if tests < 10 or failures or errors:
              raise SystemExit('R20 test gate failed')
          open('android-r3/r20-runtime-test-report.txt','w',encoding='utf-8').write(f'R20_RUNTIME_TESTS=PASS\nTESTS={tests}\nFAILURES={failures}\nERRORS={errors}\nANDROID_KEYSTORE_SMOKE=PASS\n')
          PY

      - name: Add pinned Android cloud transport
        run: |
          mkdir -p android-r3/app/src/main/jniLibs/arm64-v8a
          curl --fail --location --retry 3 --retry-delay 2 https://beta.rclone.org/v1.75.0/testbuilds/rclone-android-21-armv8a.gz --output /tmp/rclone-android.gz
          gzip -dc /tmp/rclone-android.gz > android-r3/app/src/main/jniLibs/arm64-v8a/librclone.so
          chmod 755 android-r3/app/src/main/jniLibs/arm64-v8a/librclone.so
          test -s android-r3/app/src/main/jniLibs/arm64-v8a/librclone.so

      - name: Restore fixed beta signing key
        run: |
          base64 -d android-r3/.ci/beta-keystore.b64 > android-r3/beta-test.jks
          chmod 600 android-r3/beta-test.jks

      - name: Build signed R20 release APK
        run: gradle -p android-r3 --no-daemon :app:assembleRelease

      - name: Verify R20 APK identity signature permissions and transport
        run: |
          APK=android-r3/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee android-r3/apk-verification.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 12 | tee -a android-r3/apk-verification.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK" | tee -a android-r3/apk-verification.txt
          unzip -l "$APK" | grep 'lib/arm64-v8a/librclone.so' | tee -a android-r3/apk-verification.txt
          grep -qi '9abd08f6382a49975b71ffff1a76fbb3292b508f2a3404fa0e4b2b1f3f2d1a0e' android-r3/apk-verification.txt
          grep -q "package: name='it.dossiersanitario.clinicadigitale.beta' versionCode='20' versionName='1.0.0-android-r20-test'" android-r3/apk-verification.txt
          grep -q 'android.permission.WAKE_LOCK' android-r3/apk-verification.txt
          ! "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK" | grep -Eq 'READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE|MANAGE_EXTERNAL_STORAGE|READ_MEDIA_IMAGES|READ_MEDIA_VIDEO|READ_MEDIA_AUDIO|READ_CONTACTS|ACCESS_FINE_LOCATION|RECORD_AUDIO'
          echo "SHA256=$(sha256sum "$APK" | awk '{print $1}')" | tee -a android-r3/apk-verification.txt
          echo "SIZE=$(stat -c%s "$APK")" | tee -a android-r3/apk-verification.txt

      - name: Upload verified R20 APK
        uses: actions/upload-artifact@v4
        with:
          name: ClinicaDigitale_Android_R20_KEYSTORE_RUNTIME_VERIFIED_APK
          path: |
            android-r3/app/build/outputs/apk/release/app-release.apk
            android-r3/apk-verification.txt
            android-r3/r20-runtime-test-report.txt
          if-no-files-found: error
          retention-days: 1
