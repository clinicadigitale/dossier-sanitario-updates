name: Publish Windows 1.0.1

on:
  push:
    paths:
      - ".github/workflows/publish-windows-1.0.1.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and verify current public 1.0.0
        run: |
          curl -fL --retry 3 -o public-1.0.0.exe "https://github.com/clinicadigitale/dossier-sanitario-updates/releases/download/v1.0.0/ClinicaDigitale_DossierSanitario_1.0.0_WIN64.exe"
          echo "be964d578c9d21ad5d2befb6305576e34a79b88bb532ea545945ef89b8903694  public-1.0.0.exe" | sha256sum -c -

      - name: Decode and verify authorized replacements
        run: |
          base64 -d windows-release/1.0.1/replacements.b64 > replacements.zip
          echo "03742a873157e93a697f4923c92d5f40d1862592bd17b605ea3db152f6be37ca  replacements.zip" | sha256sum -c -

      - name: Build exact Windows 1.0.1 package
        run: |
          python - <<'PY'
          import ast, hashlib, json, pathlib, zipfile

          base = pathlib.Path("public-1.0.0.exe")
          repl = pathlib.Path("replacements.zip")
          out = pathlib.Path("ClinicaDigitale_DossierSanitario_1.0.1_WIN64.exe")

          with zipfile.ZipFile(repl) as rz:
              replacements = {n: rz.read(n) for n in rz.namelist()}

          expected_replacements = {
              "payload/VERSIONE.txt",
              "payload/component_manifest.json",
              "payload/component_policy.json",
              "payload/diagnostics_config.json",
              "payload/index.html",
              "payload/js/app.js",
              "payload/python_engine/license_manager.py",
              "payload/python_engine/server.py",
              "payload/python_engine/startup_check.py",
              "payload/update_config.json",
          }
          if set(replacements) != expected_replacements:
              raise SystemExit("Replacement scope mismatch")

          with zipfile.ZipFile(base) as zin:
              infos = zin.infolist()
              if len(infos) != 2159:
                  raise SystemExit("Unexpected base archive entry count")
              first = min(i.header_offset for i in infos)
              base_bytes = base.read_bytes()
              prefix = base_bytes[:first]
              if hashlib.sha256(prefix).hexdigest() != "d5524c25c3b747080b9478fcdef5fb224dd0336224bd12f5346df7fd31d1c0ff":
                  raise SystemExit("Outer installer prefix changed")

              with out.open("wb") as f:
                  f.write(prefix)

              with zipfile.ZipFile(out, "a", allowZip64=True) as zout:
                  for info in infos:
                      data = replacements.get(info.filename, zin.read(info.filename))
                      new = zipfile.ZipInfo(info.filename, date_time=info.date_time)
                      for attr in (
                          "compress_type","comment","extra","create_system","create_version",
                          "extract_version","flag_bits","volume","internal_attr","external_attr"
                      ):
                          setattr(new, attr, getattr(info, attr))
                      new._compresslevel = 9
                      zout.writestr(new, data)

          raw = out.read_bytes()
          expected_sha = "0058c0e0dcdd6ee0af77c78df6c596f607881e6c8cdfc21be024a09dd7b4f0b9"
          if len(raw) != 138896264:
              raise SystemExit(f"Unexpected final size: {len(raw)}")
          if hashlib.sha256(raw).hexdigest() != expected_sha:
              raise SystemExit("Final SHA256 mismatch")

          with zipfile.ZipFile(out) as z:
              if z.testzip() is not None:
                  raise SystemExit("ZIP integrity failure")
              if len(z.infolist()) != 2159:
                  raise SystemExit("Final archive entry count mismatch")
              cfg = json.loads(z.read("payload/update_config.json"))
              if str(cfg.get("currentVersion")) != "1.0.1":
                  raise SystemExit("Updater version mismatch")
              index = z.read("payload/index.html").decode("utf-8")
              if "1.0.1" not in index:
                  raise SystemExit("UI version marker missing")
              server = z.read("payload/python_engine/server.py").decode("utf-8")
              required = [
                  "REMINDER_GROUPS_FILE",
                  "_medication_due_now",
                  "DossierSanitarioLocale_Group_",
                  "Tutto acquistato",
              ]
              if any(x not in server for x in required):
                  raise SystemExit("Grouped Windows reminder implementation missing")
              for name in (
                  "payload/python_engine/server.py",
                  "payload/python_engine/startup_check.py",
                  "payload/python_engine/license_manager.py",
              ):
                  ast.parse(z.read(name).decode("utf-8"), filename=name)

          print("WINDOWS_1_0_1_RELEASE_AUDIT_OK")
          PY

      - name: Publish GitHub release 1.0.1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.1 >/dev/null 2>&1; then
            echo "Release v1.0.1 already exists; refusing to overwrite."
            exit 1
          fi
          gh release create v1.0.1             ClinicaDigitale_DossierSanitario_1.0.1_WIN64.exe             --target main             --title "Clinica Digitale - Dossier Sanitario 1.0.1"             --notes "Aggiornamento Windows 1.0.1.

          Corretto il comportamento degli avvisi Windows nei Dossier familiari: gli avvisi previsti nello stesso momento per più membri vengono raccolti in un'unica notifica invece di generare finestre separate.

          Anche i promemoria di riordino farmaci dovuti contemporaneamente vengono raccolti in una sola finestra riepilogativa per il Dossier.

          Inclusi inoltre gli allineamenti già preparati per Agenda, promemoria farmaci arretrati e sincronizzazione Google Calendar.

          Le altre funzioni approvate restano preservate."

      - name: Switch stable updater to 1.0.1 only after release exists
        run: |
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path("stable.json")
          data=json.loads(p.read_text(encoding="utf-8"))
          data.update({
              "channel":"stable",
              "version":"1.0.1",
              "displayVersion":"1.0.1",
              "releaseDate":"2026-10-12",
              "required":False,
              "releaseNotes":[
                  "Clinica Digitale - Dossier Sanitario 1.0.1 per Windows.",
                  "Avvisi Windows familiari raggruppati: gli avvisi previsti nello stesso momento per più membri del Dossier vengono mostrati in un'unica notifica.",
                  "Promemoria di riordino farmaci simultanei raccolti in una sola finestra riepilogativa per il Dossier.",
                  "Allineati Agenda, promemoria farmaci arretrati e sincronizzazione Google Calendar mantenendo inalterate le funzioni già approvate.",
                  "Installer Windows preservato nel flusso approvato; permane il lieve sfarfallio della sola barra di avanzamento già accettato."
              ],
              "downloadUrl":"https://github.com/clinicadigitale/dossier-sanitario-updates/releases/download/v1.0.1/ClinicaDigitale_DossierSanitario_1.0.1_WIN64.exe",
              "sha256":"0058c0e0dcdd6ee0af77c78df6c596f607881e6c8cdfc21be024a09dd7b4f0b9",
              "size":138896264
          })
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stable.json
          git commit -m "Publish Windows stable 1.0.1"
          git push

      - name: Verify published asset
        run: |
          curl -fL --retry 3 -o published.exe "https://github.com/clinicadigitale/dossier-sanitario-updates/releases/download/v1.0.1/ClinicaDigitale_DossierSanitario_1.0.1_WIN64.exe"
          echo "0058c0e0dcdd6ee0af77c78df6c596f607881e6c8cdfc21be024a09dd7b4f0b9  published.exe" | sha256sum -c -
          test "$(stat -c%s published.exe)" = "138896264"
