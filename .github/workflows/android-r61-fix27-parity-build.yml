name: Android R61 FIX27 Parity Verified Candidate

on:
  push:
    branches:
      - android-r61-fix27-parity-0917

permissions:
  contents: read

jobs:
  build-test-sign:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild exact R59 delivered baseline
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess
          y=Path('.github/workflows/android-r47-sync-crash-graph-layout-build.yml').read_text(encoding='utf-8')
          cmds=re.findall(r'^\s*python (android-r3/[^\s]+\.py)\s*$', y, flags=re.M)
          if not cmds or not cmds[-1].endswith('r47_compile_compat_patch.py'):
              raise SystemExit('R47 patch chain not found')
          for p in cmds: subprocess.check_call(['python', p])
          PY
          python android-r3/r50_r47_height_sync_finalize_fix.py
          python android-r3/r50_test_compat_patch.py
          python android-r3/r51_graph_height_ticks_sync_reminder_patch.py
          python android-r3/r51_test_compat_patch.py
          python android-r3/r52_all_graphs_portrait_landscape_height_fix.py
          python android-r3/r52_test_compat_patch.py
          python android-r3/r53_prepare_visit_search_patch.py
          python android-r3/r53_test_compat_patch.py
          python android-r3/r54_ui_export_fix.py
          python android-r3/r55_special_tools_layout_order_cleanup.py
          python android-r3/r56_modern_media_parity_patch.py
          python android-r3/r57_sync_crash_media_fix.py
          python android-r3/r58_modern_ui_media_patch_v2.py
          python android-r3/r59_full_modern_parity_patch.py

      - name: Rebuild approved R60 candidate source
        run: |
          python android-r3/r60_ui_dicom_fixes_patch.py
          python android-r3/r60_test_compat_patch.py

      - name: Audit R60 baseline before R61
        run: |
          python - <<'PY'
          from pathlib import Path
          b=Path('android-r3/app/src/main/java/it/dossiersanitario/clinicadigitale/beta')
          main=(b/'R6MainActivity.java').read_text(encoding='utf-8')
          media=(b/'R56MediaActivity.java').read_text(encoding='utf-8')
          pressure=(b/'R33PressureChartView.java').read_text(encoding='utf-8')
          gradle=Path('android-r3/app/build.gradle').read_text(encoding='utf-8')
          assert 'DICOM e Imaging' in main
          assert 'Importa DICOM da telefono, USB o archivio collegato' in media
          assert 'getHeight() - dp(96)' in pressure and 'canvas.rotate(-45f' in pressure
          assert 'versionCode 60' in gradle
          print('R60_BASELINE_AUDIT=PASS')
          PY

      - name: Freeze sectors outside FIX27 parity scope
        run: |
          sha256sum \
            android-r3/app/src/main/java/it/dossiersanitario/clinicadigitale/beta/R12Crypto.java \
            android-r3/app/src/main/java/it/dossiersanitario/clinicadigitale/beta/R30BoundedWindows.java \
            android-r3/app/src/main/java/it/dossiersanitario/clinicadigitale/beta/R57BoundedGcmDecryptor.java \
            android-r3/app/src/main/java/it/dossiersanitario/clinicadigitale/beta/R26ChartView.java \
            android-r3/app/src/main/java/it/dossiersanitario/clinicadigitale/beta/R33PressureChartView.java \
            android-r3/app/src/main/java/it/dossiersanitario/clinicadigitale/beta/R47GraphGeometry.java \
            android-r3/app/src/main/java/it/dossiersanitario/clinicadigitale/beta/R52GraphLayout.java \
            android-r3/app/src/main/java/it/dossiersanitario/clinicadigitale/beta/R56MediaActivity.java \
            android-r3/app/src/main/java/it/dossiersanitario/clinicadigitale/beta/R34BiometricAuth.java \
            android-r3/app/src/main/AndroidManifest.xml \
            > /tmp/r61-frozen-before.sha

      - name: Establish ephemeral R60 comparison baseline
        run: |
          git add android-r3/app
          git -c user.name='R61 CI' -c user.email='ci@local.invalid' commit -m 'Ephemeral R60 generated baseline'

      - name: Apply R61 FIX27 parity patch
        run: python android-r3/r61_fix27_parity_patch.py

      - name: Prove exact R61 touched-source scope
        run: |
          python - <<'PY'
          import subprocess
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          expected={
            'android-r3/app/build.gradle',
            'android-r3/app/src/main/java/it/dossiersanitario/clinicadigitale/beta/R12CloudManager.java',
            'android-r3/app/src/main/java/it/dossiersanitario/clinicadigitale/beta/R27ExactWindows.java',
            'android-r3/app/src/main/java/it/dossiersanitario/clinicadigitale/beta/R53SpecialToolsActivity.java',
            'android-r3/app/src/main/java/it/dossiersanitario/clinicadigitale/beta/R53VisitLogic.java',
            'android-r3/app/src/main/java/it/dossiersanitario/clinicadigitale/beta/R61Fix27Parity.java',
            'android-r3/app/src/main/java/it/dossiersanitario/clinicadigitale/beta/R6MainActivity.java',
            'android-r3/app/src/test/java/it/dossiersanitario/clinicadigitale/beta/R61Fix27ParityTest.java',
          }
          if changed != expected:
              raise SystemExit('Unexpected R61 touched scope: '+repr(sorted(changed^expected)))
          print('R61_EXACT_TOUCH_SCOPE=PASS')
          PY

      - name: Prove frozen sectors byte-identical
        run: |
          sha256sum \
            android-r3/app/src/main/java/it/dossiersanitario/clinicadigitale/beta/R12Crypto.java \
            android-r3/app/src/main/java/it/dossiersanitario/clinicadigitale/beta/R30BoundedWindows.java \
            android-r3/app/src/main/java/it/dossiersanitario/clinicadigitale/beta/R57BoundedGcmDecryptor.java \
            android-r3/app/src/main/java/it/dossiersanitario/clinicadigitale/beta/R26ChartView.java \
            android-r3/app/src/main/java/it/dossiersanitario/clinicadigitale/beta/R33PressureChartView.java \
            android-r3/app/src/main/java/it/dossiersanitario/clinicadigitale/beta/R47GraphGeometry.java \
            android-r3/app/src/main/java/it/dossiersanitario/clinicadigitale/beta/R52GraphLayout.java \
            android-r3/app/src/main/java/it/dossiersanitario/clinicadigitale/beta/R56MediaActivity.java \
            android-r3/app/src/main/java/it/dossiersanitario/clinicadigitale/beta/R34BiometricAuth.java \
            android-r3/app/src/main/AndroidManifest.xml \
            > /tmp/r61-frozen-after.sha
          diff -u /tmp/r61-frozen-before.sha /tmp/r61-frozen-after.sha
          echo 'R61_FROZEN_SECTORS_BYTE_IDENTICAL=PASS'

      - name: Audit FIX27 parity source
        run: |
          python - <<'PY'
          from pathlib import Path
          b=Path('android-r3/app/src/main/java/it/dossiersanitario/clinicadigitale/beta')
          main=(b/'R6MainActivity.java').read_text(encoding='utf-8')
          exact=(b/'R27ExactWindows.java').read_text(encoding='utf-8')
          cloud=(b/'R12CloudManager.java').read_text(encoding='utf-8')
          visit=(b/'R53VisitLogic.java').read_text(encoding='utf-8')
          tools=(b/'R53SpecialToolsActivity.java').read_text(encoding='utf-8')
          parity=(b/'R61Fix27Parity.java').read_text(encoding='utf-8')
          gradle=Path('android-r3/app/build.gradle').read_text(encoding='utf-8')
          checks={
            'version': "versionCode 61" in gradle and "1.0.0-android-r61-fix27-parity-test" in gradle,
            'egfr': 'canonicalLabId' in parity and '"egfr"' in parity and 'canonicalLabName' in exact,
            'family_agenda': 'familyCalendarEvents' in exact and 'agendaAccessGrants' in parity and 'canManageAgendaAppointments' in exact and 'canManageAgendaMedications' in exact,
            'family_pills': 'r61ProfilePill' in main and 'profileColorForId' in exact,
            'medication_grouping': 'groupMedicationEvents' in parity and 'r61FamilyMedicationGroup' in main,
            'prepare_visit_family': 'familyCalendarEvents' in visit and 'r61MemberPill' in tools and 'profileName' in tools,
            'pressure_heart': 'Pressione arteriosa' in main and 'Frequenza cardiaca' in main and 'heartRate' in main,
            'doc_image_grouping': 'r61AssociateDocuments' in main and 'likelySameExam' in parity and 'examGroupId' in main,
            'cloud_quota': 'Spazio cloud' in cloud and 'R12Rclone.runBounded' in cloud,
            'idle_guard': 'technicalActivityActive' in cloud and 'technicalActivityActive' in main,
            'agenda_bootstrap': 'bootstrapR61FamilyAgendaIfNeeded' in cloud and 'importAgendaScope' in exact,
          }
          bad=[k for k,v in checks.items() if not v]
          if bad: raise SystemExit('R61 source audit failed: '+','.join(bad))
          print('R61_SOURCE_AUDIT=PASS')
          PY
          git diff --check

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Install Android SDK 35
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore official Dossier icon
        run: |
          mkdir -p android-r3/app/src/main/res/drawable-nodpi
          base64 -d android-r3/.ci/dossier-icon-r4.b64 > android-r3/app/src/main/res/drawable-nodpi/dossier_sanitario_raw.webp
          test -s android-r3/app/src/main/res/drawable-nodpi/dossier_sanitario_raw.webp

      - name: Run all inherited and R61 JVM regressions
        run: gradle -p android-r3 --no-daemon :app:testReleaseUnitTest

      - name: Verify JVM reports
        run: |
          python - <<'PY'
          import glob, xml.etree.ElementTree as ET, pathlib
          fs=glob.glob('android-r3/app/build/test-results/testReleaseUnitTest/TEST-*.xml')
          if not fs: raise SystemExit('missing JVM reports')
          t=f=e=0
          for x in fs:
              r=ET.parse(x).getroot(); t+=int(r.attrib.get('tests',0)); f+=int(r.attrib.get('failures',0)); e+=int(r.attrib.get('errors',0))
          if f or e: raise SystemExit(f'R61 tests={t} failures={f} errors={e}')
          pathlib.Path('/tmp/r61-tests.txt').write_text(f'JVM_TESTS={t}\nJVM_FAILURES={f}\nJVM_ERRORS={e}\n')
          print(pathlib.Path('/tmp/r61-tests.txt').read_text())
          PY

      - name: Add pinned Android cloud transport
        run: |
          mkdir -p android-r3/app/src/main/jniLibs/arm64-v8a
          curl --fail --location --retry 3 --retry-delay 2 https://beta.rclone.org/v1.75.0/testbuilds/rclone-android-21-armv8a.gz --output /tmp/rclone-android.gz
          gzip -dc /tmp/rclone-android.gz > android-r3/app/src/main/jniLibs/arm64-v8a/librclone.so
          chmod 755 android-r3/app/src/main/jniLibs/arm64-v8a/librclone.so

      - name: Restore fixed R13 beta signing identity
        run: |
          base64 -d android-r3/.ci/beta-keystore.b64 > android-r3/beta-test.jks
          chmod 600 android-r3/beta-test.jks

      - name: Build signed R61 APK
        run: gradle -p android-r3 --no-daemon :app:assembleRelease

      - name: Verify compiled APK identity signature permissions and assets
        run: |
          APK=android-r3/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee android-r3/apk-verification.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 14 | tee -a android-r3/apk-verification.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK" | tee -a android-r3/apk-verification.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump resources "$APK" > android-r3/apk-resources.txt
          tr -d ':' < android-r3/apk-verification.txt | tr 'A-Z' 'a-z' | grep -q '9abd08f6382a49975b71ffff1a76fbb3292b508f2a3404fa0e4b2b1f3f2d1a0e'
          grep -q "package: name='it.dossiersanitario.clinicadigitale.beta' versionCode='61' versionName='1.0.0-android-r61-fix27-parity-test'" android-r3/apk-verification.txt
          ! "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK" | grep -Eq 'READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE|MANAGE_EXTERNAL_STORAGE|READ_MEDIA_IMAGES|READ_MEDIA_VIDEO|READ_MEDIA_AUDIO|READ_CONTACTS|ACCESS_FINE_LOCATION|RECORD_AUDIO|CALL_PHONE'
          unzip -l "$APK" | grep 'lib/arm64-v8a/librclone.so' | tee -a android-r3/apk-verification.txt
          for R in r60_ic_documents r60_ic_image r60_ic_calendar r60_ic_therapy r60_ic_diagnosis r60_ic_help r60_ic_map r60_ic_weather; do
            grep -q "$R" android-r3/apk-resources.txt || exit 1
          done
          echo "APK_SIZE=$(stat -c%s "$APK")" | tee -a android-r3/apk-verification.txt

      - name: Write final R61 verification report
        run: |
          cat /tmp/r61-tests.txt > android-r3/r61-build-test-report.txt
          cat >> android-r3/r61-build-test-report.txt <<'EOF'
          R60_BASELINE_AUDIT=PASS
          R61_EXACT_TOUCH_SCOPE=PASS
          R61_FROZEN_SECTORS_BYTE_IDENTICAL=PASS
          R61_SOURCE_AUDIT=PASS
          R61_EGFR_PARITY=PASS
          R61_FAMILY_AGENDA_PERMISSIONS=PASS
          R61_PROFILE_IDENTITY_PILLS=PASS
          R61_MEDICATION_GROUPING=PASS
          R61_PREPARE_VISIT_FAMILY=PASS
          R61_PRESSURE_HEART_UNIFIED=PASS
          R61_DOCUMENT_IMAGE_ASSOCIATION=PASS
          R61_CLOUD_QUOTA_IDLE_GUARD=PASS
          R61_DICOM_R60_PRESERVED=PASS
          R61_SYNC_CRYPTO_FROZEN=PASS
          R61_SIGNING_R13=PASS
          R61_APK_IDENTITY_PERMISSIONS=PASS
          EOF
          cat android-r3/r61-build-test-report.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ClinicaDigitale_Android_R61_FIX27_PARITY_VERIFIED_CANDIDATE
          path: |
            android-r3/app/build/outputs/apk/release/app-release.apk
            android-r3/apk-verification.txt
            android-r3/apk-resources.txt
            android-r3/r61-build-test-report.txt
          if-no-files-found: error
          retention-days: 2
