plugins {
    id 'com.android.application'
}

android {
    namespace 'it.dossiersanitario.clinicadigitale.beta'
    compileSdk 35

    defaultConfig {
        applicationId 'it.dossiersanitario.clinicadigitale.beta'
        minSdk 29
        targetSdk 35
        versionCode 14
        versionName '1.0.0-android-r14-test'

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
            keepDebugSymbols += ['**/librclone.so']
        }
    }

    signingConfigs {
        beta {
            storeFile file(System.getenv('CLINICA_KEYSTORE') ?: '../beta-test.jks')
            storePassword System.getenv('CLINICA_STORE_PASSWORD') ?: 'ClinicaBeta2026!'
            keyAlias System.getenv('CLINICA_KEY_ALIAS') ?: 'clinica_beta'
            keyPassword System.getenv('CLINICA_KEY_PASSWORD') ?: 'ClinicaBeta2026!'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.beta
        }
    }
}

dependencies {
    implementation 'org.opencv:opencv:4.10.0'
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'androidx.work:work-runtime:2.9.1'
    implementation 'com.google.zxing:core:3.5.3'
}
